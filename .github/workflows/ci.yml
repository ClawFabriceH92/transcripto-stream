name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# contents: write — nécessaire pour publier l'extrait des erreurs en commentaire de commit
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Le modèle ggml est gitignoré : l'APK compile sans lui, seule l'exécution Whisper
      # sur l'appareil en a besoin. La bibliothèque native est compilée ici (sous-module
      # whisper.cpp, NDK installé par AGP au besoin).
      # La sortie Gradle est conservée (build.log) pour en publier un extrait en cas d'échec :
      # les journaux de job ne sont pas lisibles depuis l'environnement des sessions automatiques.
      - name: Build debug APK
        shell: bash
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # Release non signée (R8 actif) : une règle ProGuard manquante casse ici, pas à la publication
      - name: Build release APK (R8, unsigned)
        shell: bash
        run: ./gradlew assembleRelease --no-daemon 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      # Extrait des erreurs (compilation + tests) publié en commentaire de commit, lisible
      # anonymement via l'API : GET /repos/{owner}/{repo}/commits/{sha}/comments
      - name: Publish error excerpt as commit comment
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            grep -iE "^e: |error:|Missing class|> Task .* FAILED|Execution failed|What went wrong|Caused by:|tests completed" build.log | head -80
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  fl = tc.find('failure')
                  if fl is not None:
                      print(f"TEST FAILED {tc.get('classname')}.{tc.get('name')}: {(fl.get('message') or '')[:300]}")
          PY
          } > errors.txt 2>/dev/null || true
          [ -s errors.txt ] || echo "(aucune ligne d'erreur reconnue — voir le run ${{ github.run_id }})" > errors.txt
          body="$(printf 'CI en échec (run %s) — extrait des erreurs :\n\n```\n%s\n```\n' "${{ github.run_id }}" "$(head -c 60000 errors.txt)")"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$body" >/dev/null \
            || echo "Commentaire de commit impossible (jeton en lecture seule ?)"
