name: Release

# Construit un APK release signé COMPLET (bibliothèque native compilée depuis le
# sous-module whisper.cpp, modèle Whisper Base récupéré depuis la release v0.2.5)
# et publie la release GitHub que l'auto-updater de l'app ira chercher.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Les bibliothèques natives viennent désormais du build (sous-module whisper.cpp) ;
      # seul le modèle Base est repris de la release v0.2.5 (inchangé depuis).
      - name: Modèle Whisper Base (extrait de la release v0.2.5)
        run: |
          curl -fsSL -o base.apk \
            "https://github.com/ClawFabriceH92/transcripto-stream/releases/download/v0.2.5/transcripto-stream-v0.2.5.apk"
          unzip -o -q base.apk 'assets/models/*' -d extracted
          mkdir -p app/src/main/assets/models
          cp extracted/assets/models/ggml-base.bin app/src/main/assets/models/
          test -s app/src/main/assets/models/ggml-base.bin
          ls -l app/src/main/assets/models/

      - name: Build APK release signé
        env:
          TRANSCRIPTO_STREAM_KEYSTORE_B64: ${{ secrets.TRANSCRIPTO_STREAM_KEYSTORE_B64 }}
          TRANSCRIPTO_STREAM_KEYSTORE_PASSWORD: ${{ secrets.TRANSCRIPTO_STREAM_KEYSTORE_PASSWORD }}
          TRANSCRIPTO_STREAM_KEY_ALIAS: ${{ secrets.TRANSCRIPTO_STREAM_KEY_ALIAS }}
          TRANSCRIPTO_STREAM_KEY_PASSWORD: ${{ secrets.TRANSCRIPTO_STREAM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Vérifier la signature et la bibliothèque native
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::app-release.apk absent — APK non signé. Vérifie les secrets TRANSCRIPTO_STREAM_KEYSTORE_*."
            ls app/build/outputs/apk/release/
            exit 1
          fi
          unzip -l "$APK" | grep -E "lib/arm64-v8a/|assets/models/" || true
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libwhisper.so" || { echo "::error::libwhisper.so absente de l'APK"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libc++_shared.so" || { echo "::error::libc++_shared.so absente de l'APK"; exit 1; }
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          APK_OUT="transcripto-stream-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_OUT"
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$APK_OUT" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v${VERSION}" "$APK_OUT" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi
          echo "Release v${VERSION} publiée avec $APK_OUT"
